name: mirrorchyan_release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag (leave empty for the latest release)
        default: ''
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  mirrorchyan:
    if: ${{ github.repository_owner == 'BaiXiaoTao520' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: android
            arch: ''
            filename: app-release.apk
    steps:
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: ${{ matrix.filename }}
          mirrorchyan_rid: ZexBrowse
          tag: ${{ inputs.tag }}

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          owner: BaiXiaoTao520
          repo: ZexBrowse
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
