name: Android 自动构建与发布

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建、签名并发布 APK
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 SSH 标签签名验证环境
        env:
          SSH_SIGNING_PUBLIC_KEY: ${{ secrets.SSH_SIGNING_PUBLIC_KEY }}
          SSH_SIGNING_PRINCIPAL: ${{ vars.SSH_SIGNING_PRINCIPAL || 'minerikka@163.com' }}
        run: |
          test -n "$SSH_SIGNING_PUBLIC_KEY" || { echo "缺少 SSH_SIGNING_PUBLIC_KEY Secret"; exit 1; }
          printf '%s %s\n' "$SSH_SIGNING_PRINCIPAL" "$SSH_SIGNING_PUBLIC_KEY" > "$RUNNER_TEMP/allowed_signers"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed_signers"

      - name: 验证版本标签格式
        run: |
          case "$GITHUB_REF_NAME" in
            v*) ;;
            *) echo "请选择 v 开头的版本标签作为工作流引用"; exit 1 ;;
          esac

      - name: 验证 SSH 签名版本标签
        run: git verify-tag "$GITHUB_REF_NAME"

      - name: 验证 Android SDK
        run: |
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" || { echo "未找到 GitHub Runner 预置的 Android SDK 命令行工具"; exit 1; }
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --list >/dev/null

      - name: 安装项目所需 Android SDK 组件
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: 解码签名密钥
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "缺少 ANDROID_KEYSTORE_BASE64 Secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: 构建已签名的 Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: 生成 APK SHA-256 校验文件
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > SHA256SUMS.txt

      - name: 自动创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
