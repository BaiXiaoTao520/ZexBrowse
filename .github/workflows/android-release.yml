name: Android 自动构建与发布

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建、签名并发布 APK
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 检出源码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 配置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 读取应用版本号
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION_NAME" && test -n "$VERSION_CODE" || { echo "无法从 app/build.gradle.kts 读取版本号"; exit 1; }
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: 配置 SSH 标签签名环境
        env:
          SSH_SIGNING_PRIVATE_KEY: ${{ secrets.SSH_SIGNING_PRIVATE_KEY }}
          SSH_SIGNING_PUBLIC_KEY: ${{ secrets.SSH_SIGNING_PUBLIC_KEY }}
          SSH_SIGNING_PRINCIPAL: ${{ vars.SSH_SIGNING_PRINCIPAL || 'minerikka@163.com' }}
        run: |
          test -n "$SSH_SIGNING_PRIVATE_KEY" || { echo "缺少 SSH_SIGNING_PRIVATE_KEY Secret"; exit 1; }
          test -n "$SSH_SIGNING_PUBLIC_KEY" || { echo "缺少 SSH_SIGNING_PUBLIC_KEY Secret"; exit 1; }
          printf '%s\n' "$SSH_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/signing_key"
          chmod 600 "$RUNNER_TEMP/signing_key"
          printf '%s %s\n' "$SSH_SIGNING_PRINCIPAL" "$SSH_SIGNING_PUBLIC_KEY" > "$RUNNER_TEMP/allowed_signers"
          git config user.name "${{ github.actor }}"
          git config user.email "$SSH_SIGNING_PRINCIPAL"
          git config gpg.format ssh
          git config user.signingkey "$RUNNER_TEMP/signing_key"
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed_signers"

      - name: 验证 Android SDK
        run: |
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" || { echo "未找到 GitHub Runner 预置的 Android SDK 命令行工具"; exit 1; }
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --list >/dev/null

      - name: 安装项目所需 Android SDK 组件
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0"

      - name: 解码 APK 签名密钥
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "缺少 ANDROID_KEYSTORE_BASE64 Secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: 构建已签名的 Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: 生成 APK SHA-256 校验文件
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > SHA256SUMS.txt

      - name: 删除同版本 GitHub Release 与 SSH 签名标签
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            git push origin ":refs/tags/$RELEASE_TAG"
          fi

      - name: 创建并验证 SSH 签名版本标签
        id: tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag -s "$RELEASE_TAG" -m "ZexBrowse ${RELEASE_TAG#v}"
          git verify-tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          echo "name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: 自动创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
